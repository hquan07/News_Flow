groups:
  - name: capacity-forecast
    rules:
      - alert: DiskPredicted90PercentWithin14Days
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}[24h], 14 * 24 * 3600)
            < 0.1 * node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
          and deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}[24h]) < 0
          and count_over_time(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}[24h]) > 5000
        for: 30m
        labels: {severity: warning, component: infrastructure}
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} is forecast to exceed 90% within 14 days"
      - alert: DiskPredicted90PercentWithin5Days
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}[24h], 5 * 24 * 3600)
            < 0.1 * node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
          and deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}[24h]) < 0
          and count_over_time(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}[24h]) > 5000
        for: 30m
        labels: {severity: critical, component: infrastructure}
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} is forecast to exceed 90% within five days"
