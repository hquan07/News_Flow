global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: {database: newspulse}
      - targets: [airflow-postgres-exporter:9187]
        labels: {database: airflow}
  - job_name: mongodb
    static_configs:
      - targets: [mongodb-exporter:9216]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: clickhouse
    static_configs:
      - targets: [clickhouse:9363]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
  - job_name: api
    static_configs:
      - targets: [api:8000]
