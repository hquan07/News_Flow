x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/airflow/Dockerfile
  env_file: ../../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-newspulse_secret_key_12345}
    AIRFLOW__WEBSERVER__WTF_CSRF_ENABLED: "False"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME:-admin}
    AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-admin}
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
    MONGO_DB: ${MONGO_DB:-newspulse}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_DB: ${CLICKHOUSE_DB:-newspulse}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
    PG_HOST: ${PG_HOST:-postgres}
    PG_PORT: ${PG_PORT:-5432}
    PG_DB: ${PG_DB:-newspulse}
    PG_USER: ${PG_USER:-newspulse}
    PG_PASSWORD: ${PG_PASSWORD:-newspulse}
    PYTHONPATH: /opt/airflow
  volumes:
    - ../../data_platform/dags:/opt/airflow/dags
    - ../../infrastructure/airflow/dags:/opt/airflow/dags/telegram
    - ../../crawlers:/opt/airflow/crawlers
    - ../kafka_utils:/opt/airflow/kafka_utils
    - ../../config:/opt/airflow/config
    - ../../data_platform/warehouse:/opt/airflow/warehouse
    - ../monitoring:/opt/airflow/monitoring
    - ../../data_platform/data_quality:/opt/airflow/data_quality
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    kafka:
      condition: service_healthy
    mongo:
      condition: service_healthy
    minio:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ==================== MESSAGE BROKER ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXT_PORT:-29093}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Creating Kafka topics...'
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.general
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.sports
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.tech
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.economy
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.politics
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.entertainment
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.health
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.education
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.world
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic social_posts
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic news.law
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic newspulse.dlq
        echo 'Done!' && kafka-topics --list --bootstrap-server kafka:9092
      "

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== STORAGE ====================

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "19000:9000"
    environment:
      CLICKHOUSE_DB: newspulse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        clickhouse-client
        --host clickhouse
        --user "$${CLICKHOUSE_USER}"
        --password "$${CLICKHOUSE_PASSWORD}"
        --multiquery
        < /schema/clickhouse_schema.sql
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
    volumes:
      - ../../data_platform/warehouse/clickhouse_schema.sql:/schema/clickhouse_schema.sql:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    command: mongod --quiet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    container_name: newspulse-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-newspulse}
      POSTGRES_USER: ${PG_USER:-newspulse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-newspulse}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../../data_platform/warehouse/migrations:/docker-entrypoint-initdb.d
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - log_min_duration_statement=1000
      - -c
      - autovacuum_vacuum_scale_factor=0.1
      - -c
      - autovacuum_analyze_scale_factor=0.05
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-newspulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== ORCHESTRATION ====================
  airflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_API_USERNAME}" --firstname Admin --lastname User \
          --role Admin --email admin@newspulse.local \
          --password "$${AIRFLOW_API_PASSWORD}" || true
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        rm -f /opt/airflow/airflow-webserver.pid
        exec airflow webserver --port 8080
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname) 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ==================== API + DASHBOARD ====================
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: newspulse-api
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${API_PORT:-8001}:8000"
    env_file: ../../.env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-newspulse}
      PG_USER: ${PG_USER:-newspulse}
      PG_PASSWORD: ${PG_PASSWORD:-newspulse}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${PG_DB:-newspulse}
      POSTGRES_USER: ${PG_USER:-newspulse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-newspulse}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-newspulse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-newspulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME:-admin}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embeddings:8088
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  telegram-bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 35s
    command: python -m api.telegram_bot_worker
    healthcheck:
      disable: true
    env_file: ../../.env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-newspulse}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-newspulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
      TELEGRAM_RATE_LIMIT_PER_MINUTE: ${TELEGRAM_RATE_LIMIT_PER_MINUTE:-20}
      TELEGRAM_AUDIT_RETENTION_DAYS: ${TELEGRAM_AUDIT_RETENTION_DAYS:-90}
    depends_on:
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy



  spark-master:
    build:
      context: spark
      dockerfile: Dockerfile
    container_name: newspulse-spark-master
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8082"
    ports:
      - "7077:7077"
      - "8082:8082"
    env_file:
      - ../../.env
    environment:
      - PYTHONPATH=/opt/spark-apps
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ../../spark:/opt/spark-apps/spark
      - ../../config:/opt/spark-apps/config
      - ../../data_platform/warehouse:/opt/spark-apps/warehouse
      - spark-checkpoints:/tmp/spark-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  spark-worker:
    build:
      context: spark
      dockerfile: Dockerfile
    container_name: newspulse-spark-worker
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    env_file:
      - ../../.env
    environment:
      - SPARK_WORKER_MEMORY=6g
      - SPARK_WORKER_CORES=4
      - PYTHONPATH=/opt/spark-apps
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ../../spark:/opt/spark-apps/spark
      - ../../config:/opt/spark-apps/config
      - ../../data_platform/warehouse:/opt/spark-apps/warehouse
      - spark-checkpoints:/tmp/spark-checkpoints
      - huggingface-cache:/tmp/hf_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  spark-streaming:
    build:
      context: spark
      dockerfile: Dockerfile
    container_name: newspulse-spark-streaming
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,com.clickhouse:clickhouse-jdbc:0.4.6
      - /opt/spark-apps/spark/streaming/streaming_job.py
    env_file:
      - ../../.env
    environment:
      PYTHONPATH: /opt/spark-apps
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      SPARK_MASTER: spark://spark-master:7077
      SPARK_CHECKPOINT_ROOT: /tmp/spark-checkpoints
      RAW_MAX_OFFSETS_PER_TRIGGER: ${RAW_MAX_OFFSETS_PER_TRIGGER:-500}
      NLP_ENABLED: ${NLP_ENABLED:-false}
      NLP_MAX_OFFSETS_PER_TRIGGER: ${NLP_MAX_OFFSETS_PER_TRIGGER:-20}
      NLP_PROCESSING_PARTITIONS: ${NLP_PROCESSING_PARTITIONS:-2}
      NLP_STREAMING_TRIGGER_INTERVAL: ${NLP_STREAMING_TRIGGER_INTERVAL:-60 seconds}
      NLP_BACKFILL_WORKERS: ${NLP_BACKFILL_WORKERS:-2}
      CLICKBAIT_ENABLED: ${CLICKBAIT_ENABLED:-false}
      SOCIAL_MAX_OFFSETS_PER_TRIGGER: ${SOCIAL_MAX_OFFSETS_PER_TRIGGER:-250}
      RAW_STARTING_OFFSETS: ${RAW_STARTING_OFFSETS:-latest}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-10}
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    volumes:
      - ../../spark:/opt/spark-apps/spark
      - ../../config:/opt/spark-apps/config
      - ../../data_platform/warehouse:/opt/spark-apps/warehouse
      - spark-checkpoints:/tmp/spark-checkpoints
      - huggingface-cache:/tmp/hf_cache
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'streaming_job.py' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  sentiment-backfill:
    profiles: [backfill]
    build:
      context: spark
      dockerfile: Dockerfile
    container_name: newspulse-sentiment-backfill
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command:
      - python3
      - /opt/spark-apps/warehouse/sentiment_backfill.py
      - --workers
      - "${NLP_BACKFILL_WORKERS:-2}"
      - --threads-per-worker
      - "${NLP_BACKFILL_THREADS_PER_WORKER:-2}"
      - --batch-size
      - "${NLP_BACKFILL_BATCH_SIZE:-20}"
    env_file:
      - ../../.env
    environment:
      PYTHONPATH: /opt/spark-apps
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-newspulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      NLP_BACKFILL_WORKERS: ${NLP_BACKFILL_WORKERS:-2}
      NLP_BACKFILL_THREADS_PER_WORKER: ${NLP_BACKFILL_THREADS_PER_WORKER:-2}
      NLP_BACKFILL_BATCH_SIZE: ${NLP_BACKFILL_BATCH_SIZE:-20}
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ../../spark:/opt/spark-apps/spark
      - ../../config:/opt/spark-apps/config
      - ../../data_platform/warehouse:/opt/spark-apps/warehouse
      - huggingface-cache:/tmp/hf_cache
    restart: "no"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: newspulse-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.13.6
    profiles: [rag]
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  embeddings:
    build:
      context: ../..
      dockerfile: rag/Dockerfile
    profiles: [rag]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  rag-indexer:
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles: [rag]
    restart: unless-stopped
    env_file: ../../.env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embeddings:8088
    command: ["python", "-m", "api.services.rag_indexer", "--loop", "300"]
    healthcheck:
      disable: true
    depends_on:
      clickhouse:
        condition: service_healthy
      mongo:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      qdrant:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: newspulse-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/newspulse.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    profiles: [monitoring]
    restart: unless-stopped
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - --docker_only=true


volumes:
  zookeeper-data:
  kafka-data:
  mongo-data:
  pg-data:
  airflow-db-data:
  airflow-logs:
  metabase-data:
  spark-checkpoints:
  huggingface-cache:
  minio-data:
  clickhouse-data:
  qdrant-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
